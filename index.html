<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Welcome to Rainy Days - a website selling jackets for all kinds of weather.  "
    />
    <title>Rainy Days - Pushing The Comfort Zone</title>
    <link rel="stylesheet" href="src/css/styles.css" />
    <script
      src="https://kit.fontawesome.com/7379cbeaed.js"
      crossorigin="anonymous"
    ></script>
  </head>

  <body>
    <header>
      <nav class="navbar">
        <div class="navdiv">
          <a href="/">
            <img
              id="logo"
              src="assets/images/rainydayslogo_2.png"
              alt="RainyDays Logo"
            />
          </a>
          <ul>
            <li><a href="index.html" class="active">Home</a></li>
            <li><a href="/html/products.html">Jackets</a></li>
            <li><a href="/html/about.html">About</a></li>
            <li><a href="/html/contact.html">Contact</a></li>
          </ul>
          <div class="icon-cart">
            <svg
              aria-hidden="true"
              xmlns="http://www.w3.org/2000/svg"
              width="24"
              height="24"
              fill="none"
              viewBox="0 0 24 24"
            >
              <path
                stroke="currentColor"
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M5 4h1.5L9 16m0 0h8m-8 0a2 2 0 1 0 0 4 2 2 0 0 0 0-4Zm8 0a2 2 0 1 0 0 4 2 2 0 0 0 0-4Zm-8.5-3h9.25L19 7H7.312"
              />
            </svg>
            <span>0</span>
          </div>
        </div>
      </nav>
    </header>

    <main>
      <h1>Product Management</h1>
      <form id="product-form">
        <input type="text" id="name" placeholder="Product Name" />
        <input type="number" id="price" placeholder="Product Price" />
        <textarea id="description" placeholder="Product Description"></textarea>
        <input type="file" id="image" placeholder="Product Image" />
        <input type="text" id="category" placeholder="Product Category" />
        <button type="submit">Add Product</button>
      </form>
      <div id="product-list"></div>

      <h1 id="our-collection">Our collection</h1>
      <section id="items-container" class="jackets-container"></section>
    </main>

    <div class="wrapper">
      <footer class="page-footer">
        <a href="/">
          <img
            id="logo2"
            src="assets/images/rainydayslogo_2.png"
            alt="RainyDays Logo"
          />
        </a>
        <p class="footer-text">Rainy Days Company &copy;</p>
        <p class="footer-text">London, England</p>
        <p class="footer-text">All rights reserved, Rainy Days 2024</p>
        <div class="social-icons">
          <i class="fa-brands fa-instagram"></i>
          <i class="fa-brands fa-facebook"></i>
          <i class="fa-brands fa-youtube"></i>
        </div>
      </footer>
    </div>
    <script src="/src/script/products.js"></script>
  </body>
</html>
